[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-user-model"
version = "0.1.0"
description = "LUMOS: Large User MOdel Series — Transformer framework for multi-task user behavior prediction"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Dhruv Nigam"},
]
keywords = [
    "transformer",
    "user-modeling",
    "multi-task-learning",
    "pytorch",
    "deep-learning",
    "user-embeddings",
    "behavior-prediction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
training = [
    "tensorboard>=2.14",
    "psutil>=5.9",
    "loguru>=0.7",
]
visualization = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "umap-learn>=0.5",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]
all = ["lumos-user-model[training,visualization,dev]"]

[project.urls]
Homepage = "https://github.com/dhruvnigam93/lumos-user-model"
Paper = "https://arxiv.org/abs/2512.08957"
Issues = "https://github.com/dhruvnigam93/lumos-user-model/issues"

[tool.setuptools.packages.find]
include = ["lumos*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
