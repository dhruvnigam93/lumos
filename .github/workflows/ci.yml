name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[training,dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Check for proprietary references
        run: |
          if grep -ri "dream11\|databricks\|dbfs\|s3a://\|mlflow\|pacman\|sporta\|iceberg_catalog\|accio\|@dream11\|dreamsports\|nimbus" lumos/ examples/ tests/; then
            echo "FAIL: proprietary references found"
            exit 1
          fi
